    </div>

  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="prog"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Programme</span></button>
    <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg><span>Séance</span></button>
    <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L20 7"/></svg><span>Stats</span></button>
    <button data-tab="body"><svg viewBox="0 0 24 24"><path d="M12 3a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM7 10h10l-1.5 5H14l-.5 6h-3l-.5-6H8.5L7 10Z"/></svg><span>Corps</span></button>
